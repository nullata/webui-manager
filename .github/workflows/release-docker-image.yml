name: Release Docker Image

# Builds and pushes nullata/webui-manager to Docker Hub and ghcr.io when VERSION
# changes on main. Equivalent to docker-image-build.sh (tags :latest and
# :<VERSION>) plus the push to both registries.
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  schedule:
    # Weekly rebuild+repush of whatever VERSION currently says on main, as a
    # freshness check on main's HEAD against the registries. GitHub cron is
    # UTC: 19:00 UTC = 21:00 EET (+02:00). Becomes 21:00 CEST at 18:00 UTC
    # in summer; shift this if that matters to you.
    - cron: '0 19 * * 4'
  workflow_dispatch: # Allow manual trigger / re-run

# Two quick VERSION bumps must not race on the :latest tag.
concurrency:
  group: release-docker
  cancel-in-progress: false

jobs:
  # Same three suites as ci.yml, as a publish gate: the image build below
  # needs all of them green. A manual workflow_dispatch from any branch
  # must not skip them. Cheap insurance before the image lands on Docker
  # Hub and ghcr.io.
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Equivalent of nullGuard's `go vet`: catch syntax/encoding errors
      # without importing anything.
      - name: Compile check
        run: python -m compileall -q app run.py

      # SQLite backend, no browser — the fast suite (~25s locally).
      - name: Test
        run: python -m pytest -m "not browser and not postgres"

  postgres:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the ephemeral CI container only.
          POSTGRES_USER: webui
          POSTGRES_PASSWORD:
            ci-only-not-a-secret
          POSTGRES_DB: webui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webui -d webui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # conftest.py maps POSTGRES_TEST_URL onto DATABASE_URL, switching the
    # app's engine to the Postgres dialect for the -m postgres tests.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        env:
          POSTGRES_TEST_URL: postgresql://webui:ci-only-not-a-secret@localhost:5432/webui_test
        run: python -m pytest -m postgres

  browser:
    if: github.ref == 'refs/heads/main'
    # Pinned: ubuntu-latest moved to 26.04, and Playwright 1.60.0 refuses to
    # install chromium there ("Playwright does not support chromium on
    # ubuntu26.04-x64"). Unpin (or bump playwright) once it supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Test
        run: python -m pytest -m browser

  build-and-push:
    needs: [test, postgres, browser]
    # Only main may publish — workflow_dispatch can be started from any branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege: only need to read the repo
      packages: write # create/update the ghcr.io package with GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "❌ Version file not found!"
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "❌ VERSION is not a valid version string: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building nullata/webui-manager:$version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: nullata
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      # GITHUB_TOKEN auths ghcr.io for the same account (nullata), no new secret.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            nullata/webui-manager:latest
            nullata/webui-manager:${{ steps.version.outputs.version }}
            ghcr.io/nullata/webui-manager:latest
            ghcr.io/nullata/webui-manager:${{ steps.version.outputs.version }}
          # Links the GHCR package to this repo (README + "Connected to repository").
          labels: org.opencontainers.image.source=https://github.com/nullata/webui-manager
          annotations: index:org.opencontainers.image.source=https://github.com/nullata/webui-manager
          cache-from: type=gha
          cache-to: type=gha,mode=max
