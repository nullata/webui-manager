name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Equivalent of nullGuard's `go vet`: catch syntax/encoding errors
      # without importing anything.
      - name: Compile check
        run: python -m compileall -q app run.py

      # SQLite backend, no browser — the fast suite (~25s locally).
      - name: Test
        run: python -m pytest -m "not browser and not postgres"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the ephemeral CI container only.
          POSTGRES_USER: webui
          POSTGRES_PASSWORD:
            ci-only-not-a-secret
          POSTGRES_DB: webui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webui -d webui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # conftest.py maps POSTGRES_TEST_URL onto DATABASE_URL, switching the
    # app's engine to the Postgres dialect for the -m postgres tests.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        env:
          POSTGRES_TEST_URL: postgresql://webui:ci-only-not-a-secret@localhost:5432/webui_test
        run: python -m pytest -m postgres

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Test
        run: python -m pytest -m browser
